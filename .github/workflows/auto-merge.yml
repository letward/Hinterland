name: Auto Merge

on:
  pull_request:
    types: [opened, synchronize, labeled, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge safe autopilot PRs
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'autopilot')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check changed paths (safety guard)
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100,
            });
            const dangerous = files.some(f =>
              f.filename.startsWith('.github/workflows/') ||
              f.filename.startsWith('security/') ||
              f.filename === 'package.json'
            );
            // Also block if package.json scripts changed
            let scriptsChanged = false;
            for (const f of files) {
              if (f.filename === 'package.json' && f.patch && /"scripts"/.test(f.patch)) scriptsChanged = true;
            }
            if (dangerous || scriptsChanged) {
              core.setOutput('safe', 'false');
              console.log('Unsafe changes detected - manual review required');
            } else {
              core.setOutput('safe', 'true');
            }

      - name: Enable auto-merge
        if: steps.guard.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --auto --squash --repo ${{ github.repository }} || true

      - name: Label needs-review if unsafe
        if: steps.guard.outputs.safe == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['needs-review'],
            });