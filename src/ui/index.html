<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="utf8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self'; media-src 'self' data: blob:; form-action 'none'; base-uri 'none'; object-src 'none'"
    />
    <title>Hinterland</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/chrome.css" />
    <link rel="stylesheet" href="css/panels.css" />
    <link rel="stylesheet" href="css/store.css" />
  </head>
  <body>
    <div class="shell" id="shell">
      <div class="tabstrip" id="tabstrip" role="tablist">
        <div class="titlebarGrip"></div>
        <div class="tabs" id="tabs"></div>
        <button class="tabAction newTab" id="newTab" title="Neuer Tab" aria-label="Neuer Tab"></button>
        <div class="windowButtons" id="windowButtons">
          <button class="windowButton" data-window="minimize" title="Minimieren" aria-label="Minimieren">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" /></svg>
          </button>
          <button class="windowButton" data-window="maximize" title="Maximieren" aria-label="Maximieren">
            <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" rx="1.2" /></svg>
          </button>
          <button class="windowButton windowButtonDanger" data-window="close" title="Schließen" aria-label="Schließen">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" /></svg>
          </button>
        </div>
      </div>

      <div class="toolbar" id="toolbar">
        <div class="navGroup">
          <button class="iconButton" id="back" title="Zurück" aria-label="Zurück"></button>
          <button class="iconButton" id="forward" title="Vorwärts" aria-label="Vorwärts"></button>
          <button class="iconButton" id="reload" title="Neu laden" aria-label="Neu laden"></button>
          <button class="iconButton" id="home" title="Startseite" aria-label="Startseite"></button>
        </div>

        <form class="omni" id="omni" autocomplete="off">
          <span class="omniIcon" id="omniIcon"></span>
          <input
            class="omniInput"
            id="omniInput"
            type="text"
            spellcheck="false"
            autocomplete="off"
            aria-label="Adresse oder Suchbegriff"
          />
          <button class="omniReader" id="omniReader" type="button" title="Leseansicht" aria-label="Leseansicht" hidden></button>
          <button class="omniZoom" id="omniZoom" type="button" hidden></button>
          <button class="omniClear" id="omniClear" type="button" title="Leeren" aria-label="Leeren"></button>
          <button class="omniStar" id="omniStar" type="button" title="Lesezeichen" aria-label="Lesezeichen"></button>
          <div class="omniProgress" id="omniProgress"></div>
        </form>

        <div class="toolGroup">
          <button class="iconButton" id="storeButton" title="Hinter Store" aria-label="Hinter Store"></button>
          <button class="iconButton" id="findButton" title="Suchen" aria-label="Suchen"></button>
          <button class="iconButton" id="downloadsButton" title="Downloads" aria-label="Downloads"></button>
          <button class="iconButton" id="extensionsButton" title="Erweiterungen" aria-label="Erweiterungen"></button>
          <button class="iconButton" id="menuButton" title="Menü" aria-label="Menü"></button>
        </div>
      </div>

      <div class="extensionToolbar" id="extensionToolbar"></div>
      <div class="bookmarksBar" id="bookmarksBar" hidden></div>

      <div class="findBar" id="findBar" hidden>
        <span class="findIcon" id="findIcon"></span>
        <input class="findInput" id="findInput" type="text" placeholder="In Seite suchen" aria-label="In Seite suchen" />
        <span class="findCount" id="findCount">0/0</span>
        <button class="iconButton small" id="findPrev" title="Vorheriger Treffer" aria-label="Vorheriger Treffer"></button>
        <button class="iconButton small" id="findNext" title="Nächster Treffer" aria-label="Nächster Treffer"></button>
        <button class="iconButton small" id="findClose" title="Schließen" aria-label="Schließen"></button>
      </div>

      <div class="downloadShelf" id="downloadShelf" hidden></div>
    </div>

    <div class="popup" id="popup" hidden></div>
    <div class="toastStack" id="toastStack"></div>

    <dialog class="modal" id="modal">
      <div class="modalSurface" id="modalSurface">
        <div class="modalContent" id="modalContent"></div>
      </div>
    </dialog>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
